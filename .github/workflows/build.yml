name: guppy build

# Builds and publishes a release only when a PR is merged into main.
on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    strategy:
      matrix:
        include:
          # Ender-3 V3 KE only: MIPS, 480x272 small screen.
          - arch: mipsel-buildroot-linux-musl-
            theme: material
            small: true
            rotate: false
            calibrate: true
            asset: guppyscreen-smallscreen

    runs-on: ubuntu-22.04
    container:
      # Public upstream cross toolchain (same image as pull_request.yml).
      image: ballaswag/guppydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}
      GUPPY_THEME: ${{ matrix.theme }}

    steps:
    # Build the merge commit that landed on main.
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        submodules: recursive

    - name: set guppyscreen version
      run: |
        SHORT_SHA=$(echo "${{ github.event.pull_request.merge_commit_sha }}" | cut -c1-7)
        echo "GUPPYSCREEN_VERSION=pr${{ github.event.pull_request.number }}-${SHORT_SHA}" >> $GITHUB_ENV
        echo "RELEASE_TAG=pr${{ github.event.pull_request.number }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.rotate
      name: export screen rotate
      run: |
        echo "GUPPY_ROTATE=${{ matrix.rotate }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "EVDEV_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: patch KE framebuffer/touch fixes in lv_drivers
      run: |
        git apply ../patches/0001-lv_drivers-ke.patch
      working-directory: ./lv_drivers

    - name: patch fmt in spdlog
      run: |
        git apply ../patches/0002-spdlog_fmt_initializer_list.patch
      working-directory: ./spdlog

    - name: patch dpi text scale in lvgl
      run: |
        git apply ../patches/0003-lvgl-dpi-text-scale.patch
      working-directory: ./lvgl

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make libspdlog
      run: make libspdlog.a

    - name: make guppyscreen
      run: make -j

    - name: make kd_graphic_mode
      run: make kd_graphic_mode

    - name: make guppybeep
      run: ${CROSS_COMPILE}gcc -O2 -static -o build/bin/guppybeep k1/k1_mods/buzzer/guppybeep.c

    - name: package release
      run: |
        chmod +x ./scripts/release.sh
        ./scripts/release.sh ${{ matrix.asset }}

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz

    - name: release
      uses: softprops/action-gh-release@v3
      with:
        name: "${{ env.GUPPYSCREEN_VERSION }}: ${{ github.event.pull_request.title }}"
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
        body: "Built from merged PR #${{ github.event.pull_request.number }}."
        files: ${{ matrix.asset }}.tar.gz
        fail_on_unmatched_files: true
